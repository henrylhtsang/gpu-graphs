  <text class="lane-title" x="85" y="445">Consumer WG1 · WGMMA</text><text class="lane-note" x="85" y="471">score/dP pair, pointwise, gradient fan-out</text>
  <rect class="outline" x="880" y="412" width="200" height="78" rx="11" fill="#eef3f5"/><text class="box-text" x="980" y="443">wait Qⱼ,dOⱼ</text><text class="box-note" x="980" y="467">pipeline full</text>
  <rect class="outline" x="1110" y="412" width="210" height="78" rx="11" fill="#b8dfd4"/><text class="box-text" x="1215" y="443">Sⱼ = QⱼKᵀ</text><text class="box-note" x="1215" y="467">WGMMA 1</text>
  <rect class="outline" x="1350" y="412" width="225" height="78" rx="11" fill="#b8dfd4"/><text class="box-text" x="1463" y="443">dPⱼ = dOⱼVᵀ</text><text class="box-note" x="1463" y="467">WGMMA 2</text>
  <rect class="outline" x="1605" y="412" width="245" height="78" rx="11" fill="#88cdb8"/><text class="box-text" x="1728" y="443">rebuild Pⱼ; form dSⱼ</text><text class="box-note" x="1728" y="467">LSEⱼ and Dⱼ</text>
  <rect class="outline" x="1880" y="412" width="205" height="78" rx="11" fill="#b8dfd4"/><text class="box-text" x="1983" y="443">dV += PⱼᵀdOⱼ</text><text class="box-note" x="1983" y="467">WGMMA 3</text>
  <rect class="outline" x="2115" y="412" width="215" height="78" rx="11" fill="#b8dfd4"/><text class="box-text" x="2223" y="443">dQⱼ = dSⱼK</text><text class="box-note" x="2223" y="467">WGMMA 4</text>
  <path class="arrow" d="M1080 451H1107"/><path class="arrow" d="M1320 451H1347"/><path class="arrow" d="M1575 451H1602"/><path class="arrow" d="M1850 451H1877"/><path class="arrow" d="M2085 451H2112"/>

  <text class="lane-title" x="85" y="625">Consumer WG2 · WGMMA</text><text class="lane-note" x="85" y="651">partition peer; protects shared P/dS</text>
  <rect class="outline" x="1000" y="592" width="210" height="78" rx="11" fill="#eef3f5"/><text class="box-text" x="1105" y="623">wait PipelineQ</text><text class="box-note" x="1105" y="647">peer fragment</text>
  <rect class="outline" x="1240" y="592" width="245" height="78" rx="11" fill="#d8c5e8"/><text class="box-text" x="1363" y="623">read Pⱼ before overwrite</text><text class="box-note" x="1363" y="647">PdS named barrier</text>
