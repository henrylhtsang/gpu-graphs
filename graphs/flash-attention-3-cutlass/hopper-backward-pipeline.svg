  <rect class="outline" x="1520" y="232" width="340" height="78" rx="11" fill="#d7e8f2"/><text class="box-text" x="1690" y="263">TMA dOⱼ + Dⱼ</text><text class="box-note" x="1690" y="287">commit Pipeline-dO</text>
