<svg data-authoring="llm-direct" data-authoring-profile="direct-role-memory" data-structure-version="three-phase-role-memory-v1" data-topic-id="flash-attention-3-cutlass" data-graph-id="hopper-backward-pipeline" data-kernel-id="hopper-backward-pipeline" data-source-id="flash-attention" xmlns="http://www.w3.org/2000/svg" width="3000" height="2200" viewBox="0 0 3000 2200" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention-3 CUTLASS Hopper backward · producer subgroup and five-WGMMA path</title>
  <desc id="desc">A three-phase reconstruction of FlashAttnBwdSm90 and CollectiveMainloopBwdSm90 for a dense head-dimension-128 path. Producer warpgroup warp 0 loads fixed K and V plus pipelined Q, dO, LSE, and dPsum. Producer warp 1 drains shared dQ with bulk reduce-add. Two consumer warpgroups execute the score, dP, dV, dQ, and dK WGMMAs. Mainloop shared storage is unioned with the epilogue, so K and V storage becomes dK and dV only after all consumers finish. SM90 has no tensor memory.</desc>
  <defs>
    <style>
