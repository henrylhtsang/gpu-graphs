  <rect width="3000" height="2200" fill="#f8fafb"/>
  <text class="title" x="70" y="66">FlashAttention-3 CUTLASS SM90 backward · D=128 dense path</text>
  <text class="subtitle" x="70" y="108">Kernel wrapper: FlashAttnBwdSm90 · mainloop: CollectiveMainloopBwdSm90 · two consumer warpgroups.</text>
  <text class="subtitle" x="70" y="140">The producer warpgroup is not one role: warp 0 moves operands; warp 1 independently drains dQ.</text>

