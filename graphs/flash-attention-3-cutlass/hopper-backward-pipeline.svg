  <rect class="outline" x="1790" y="592" width="235" height="78" rx="11" fill="#d8c5e8"/><text class="box-text" x="1908" y="623">dK += dSⱼᵀQⱼ</text><text class="box-note" x="1908" y="647">WGMMA 5</text>
