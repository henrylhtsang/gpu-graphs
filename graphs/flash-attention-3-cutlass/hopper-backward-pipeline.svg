  <rect class="outline" x="620" y="1320" width="390" height="78" rx="10" fill="#d7e8f2"/><text class="box-text" x="815" y="1350">dO + D stages</text><text class="box-note" x="815" y="1376">Pipeline-dO</text>
  <rect class="outline" x="1030" y="1320" width="390" height="78" rx="10" fill="#d8ebe5"/><text class="box-text" x="1225" y="1350">K / V fixed tiles</text><text class="box-note" x="1225" y="1376">unioned with epilogue</text>
  <rect class="outline" x="1440" y="1320" width="390" height="78" rx="10" fill="#cfe9df"/><text class="box-text" x="1635" y="1350">P / dS stages</text><text class="box-note" x="1635" y="1376">PdS barrier</text>
  <rect class="outline" x="1850" y="1320" width="390" height="78" rx="10" fill="#f8e2ad"/><text class="box-text" x="2045" y="1350">dQ handoff</text><text class="box-note" x="2045" y="1376">Full / Empty WG barriers</text>
  <rect class="outline" x="2260" y="1320" width="630" height="78" rx="10" fill="#b8dfd4"/><text class="box-text" x="2575" y="1350">FP32 dK + dV register accumulators</text><text class="box-note" x="2575" y="1376">persist across all m-block iterations</text>
  <text class="memory-label" x="90" y="1490">TMEM</text>
  <rect class="outline" x="210" y="1455" width="2680" height="82" rx="10" fill="#e8eef2"/><text class="box-text" x="1550" y="1487">not available on SM90</text><text class="box-note" x="1550" y="1514">WGMMA accumulators remain in registers; pipeline operands and cross-role handoffs use SMEM</text>
  <text class="box-text" x="1550" y="1598">The C++ SharedStorage union makes the mainloop / epilogue reuse physical, not conceptual.</text>

  <text class="panel-title" x="70" y="1690">MEMORY LIFETIMES · SAME PROLOGUE / MAINLOOP / EPILOGUE AXIS</text>
