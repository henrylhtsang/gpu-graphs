  <text class="memory-label" x="90" y="1936">Q / dO</text><g class="resource-lifetime" data-resource-id="q-do-pipelines"><rect class="life-box outline" x="470" y="1900" width="1780" height="54" rx="9" fill="#d7e8f2"/><text class="box-text" x="1360" y="1933">stage j consumed while alternate slot receives j+1</text></g>
