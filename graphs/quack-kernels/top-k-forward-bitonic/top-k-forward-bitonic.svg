  <line class="grid" x1="60" y1="395" x2="2340" y2="395"/><line class="grid" x1="60" y1="575" x2="2340" y2="575"/><line class="grid" x1="60" y1="755" x2="2340" y2="755"/>
  <text class="phase" data-phase-id="prologue" x="630" y="237">PROLOGUE · acquire / seed</text><text class="phase" data-phase-id="mainloop" x="1268" y="237">MAINLOOP · cooperative selection</text><text class="phase" data-phase-id="epilogue" x="2018" y="237">EPILOGUE · publish / release</text>
  <text class="lane" x="92" y="280">All participating warps</text><text class="lane-note" x="92" y="308">load and prepare one row tile</text>
  <rect class="node operation" x="465" y="255" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="296">GMEM → registers</text>
  <rect class="node operation" x="875" y="255" width="250" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1000" y="296">convert FP32</text><path class="arrow" d="M795 296 H872"/>
  <rect class="node operation" x="1160" y="255" width="250" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1285" y="286">encode index</text><text class="mini" x="1285" y="311">low mantissa bits</text><path class="arrow" d="M1125 296 H1157"/>
  <rect class="node operation" x="1445" y="255" width="220" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1555" y="296">OOB → −∞</text><path class="arrow" d="M1410 296 H1442"/>
  <text class="lane" x="92" y="460">Cooperative warp network</text><text class="lane-note" x="92" y="488">every row warp executes the same stages</text>
  <rect class="node operation" x="875" y="435" width="250" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1000" y="476">compare / swap</text>
  <rect class="node operation" x="1160" y="435" width="250" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1285" y="476">warp shuffles</text><path class="arrow" d="M1125 476 H1157"/>
  <rect class="node operation" x="1445" y="435" width="220" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1555" y="476">bitonic_topk(k)</text><path class="arrow" d="M1410 476 H1442"/>
  <rect class="node operation" x="1770" y="435" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1935" y="476">lane 0 owns selected k</text><path class="arrow" d="M1665 476 H1767"/>
  <text class="lane" x="92" y="640">Lane 0 → row threads</text><text class="lane-note" x="92" y="668">redistribute selected values and indices</text>
  <rect class="node operation" x="875" y="615" width="250" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1000" y="656">extract index bits</text>
  <rect class="node operation" x="1160" y="615" width="250" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1285" y="656">restore value</text><path class="arrow" d="M1125 656 H1157"/>
  <rect class="node operation" x="1445" y="615" width="220" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1555" y="656">shuffle from lane 0</text><path class="arrow" d="M1410 656 H1442"/>
  <rect class="node operation" x="1770" y="615" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1935" y="656">vectorize fragments</text><path class="arrow" d="M1665 656 H1767"/>
  <text class="lane" x="92" y="820">Selected-k output role</text><text class="lane-note" x="92" y="848">all selected lanes; optional softmax</text>
  <rect class="node operation" x="875" y="795" width="250" height="82" rx="12" fill="#f2d394"/><text class="box" x="1000" y="836">row max</text>
  <rect class="node operation" x="1160" y="795" width="250" height="82" rx="12" fill="#f2d394"/><text class="box" x="1285" y="836">exp + warp sum</text><path class="arrow" d="M1125 836 H1157"/>
  <rect class="node operation" x="1445" y="795" width="220" height="82" rx="12" fill="#f2d394"/><text class="box" x="1555" y="836">normalize</text><path class="arrow" d="M1410 836 H1442"/>
  <rect class="node operation" x="1770" y="795" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1935" y="836">store values + indices</text><path class="arrow" d="M1665 836 H1767"/>
  <path class="dep sync" d="M1555 337 V432"/><path class="dep sync" d="M1555 517 V612"/><path class="dep sync" d="M1555 697 V792"/>
  <rect x="70" y="975" width="2260" height="70" rx="11" fill="#fff7df" stroke="#b87912" stroke-width="1.5"/>
  <text class="note" x="100" y="1018">Tie-breaking is encoded into otherwise discarded mantissa bits so earlier columns win deterministically.</text>
  <text class="panel-title" x="70" y="1095">ON-CHIP MEMORY PARTITION</text>
  <rect x="60" y="1120" width="2280" height="310" rx="12" fill="#fff" stroke="#d4e0e7" stroke-width="1.5"/>
  <text class="memory-label" x="90" y="1172">SMEM</text>
  <rect class="mem-node" x="235.0" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="572.1666666666667" y="1177">input tile(s)</text><text class="mem-note" x="572.1666666666667" y="1206">coalesced staging</text><rect class="mem-node" x="925.3333333333334" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="1262.5" y="1177">exchange / reduce</text><text class="mem-note" x="1262.5" y="1206">barriers + partials</text><rect class="mem-node" x="1615.6666666666667" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="1952.8333333333335" y="1177">output tile</text><text class="mem-note" x="1952.8333333333335" y="1206">when required</text>
  <text class="memory-label" x="90" y="1310">TMEM</text>
  <rect class="mem-node" x="235.0" y="1278" width="2055.0" height="92" rx="11" fill="#cfe9df"/><text class="mem-name" x="1262.5" y="1315">not applicable</text><text class="mem-note" x="1262.5" y="1344">this kernel does not use TMEM</text>
  <text class="panel-title" x="70" y="1485">MEMORY LIFETIMES · SAME SEMANTIC EVENT AXIS</text>
  <rect x="60" y="1505" width="2280" height="270" rx="12" fill="#fff" stroke="#d4e0e7" stroke-width="1.5"/>
  <text class="phase" data-phase-id="prologue-memory" x="630" y="1532">PROLOGUE</text><text class="phase" data-phase-id="mainloop-memory" x="1268" y="1532">MAINLOOP</text><text class="phase" data-phase-id="epilogue-memory" x="2018" y="1532">EPILOGUE</text>
  <line x1="835" y1="1506" x2="835" y2="1774" stroke="#d4e0e7" stroke-width="1.5"/><line x1="1700" y1="1506" x2="1700" y2="1774" stroke="#d4e0e7" stroke-width="1.5"/>
  <text class="memory-label" x="90" y="1595">SMEM</text><g class="memory-lifetime resource-lifetime" data-resource-id="smem-working-set"><rect class="life-box" x="465" y="1555" width="1200" height="64" rx="11" fill="#d7e8f2" stroke="#294251" stroke-width="1.5"/><text class="mem-name" x="1065" y="1582">input / exchange working set</text><text class="mem-note" x="1065" y="1607">acquire before use · release after the last cooperative barrier</text></g><g class="memory-lifetime resource-lifetime" data-resource-id="smem-output"><rect class="life-box" x="1770" y="1555" width="465" height="64" rx="11" fill="#f2d394" stroke="#294251" stroke-width="1.5"/><text class="mem-name" x="2002" y="1582">output staging</text><text class="mem-note" x="2002" y="1607">only when implementation stages stores</text></g>
  <text class="memory-label" x="90" y="1685">TMEM / REG</text><g class="memory-lifetime resource-lifetime" data-resource-id="compute-state"><rect class="life-box" x="900" y="1645" width="1335" height="64" rx="11" fill="#cfe9df" stroke="#294251" stroke-width="1.5"/><text class="mem-name" x="1568" y="1672">register compute state; TMEM only on the SM100 GEMM path</text><text class="mem-note" x="1568" y="1697">live through the body, then consumed or stored in the epilogue</text></g>
  <text class="note" x="90" y="1748">Reuse rule: recycle a physical SMEM slot only after its last consumer barrier; adjacent labels do not imply aliasing.</text>
