  <rect width="2400" height="1500" fill="#f8fafb"/>
  <text class="title" x="70" y="66">QuACK top-k forward · bitonic select with stable ties</text>
  <text class="subtitle" x="70" y="108">Power-of-two N and k≤128; values and indices stay in registers through selection.</text>
  <text class="subtitle" x="70" y="145">CuTe DSL entry point: <tspan class="source">quack/topk.py · TopK.kernel()</tspan></text>
  <text class="panel-title" x="70" y="195">WARP / WARP-GROUP ROLE TIMELINE</text>
  <text class="role-summary" x="455" y="195">cooperative CTA: participating warps follow the same phase sequence; no dedicated producer / consumer warp roles</text>
  <rect x="60" y="215" width="2280" height="730" rx="12" fill="#fff" stroke="#d4e0e7" stroke-width="1.5"/>
  <rect class="phase-band" data-phase-id="prologue" x="425" y="216" width="410" height="728" fill="#eef6fa"/>
  <rect class="phase-band" data-phase-id="mainloop" x="835" y="216" width="865" height="728" fill="#fbfcfd"/>
  <rect class="phase-band" data-phase-id="epilogue" x="1700" y="216" width="639" height="728" fill="#fff8e7"/>
