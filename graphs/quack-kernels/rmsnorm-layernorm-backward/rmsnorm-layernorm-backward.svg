  <text class="phase" data-phase-id="prologue" x="630" y="237">PROLOGUE · seed Xj / dOj</text><text class="phase" data-phase-id="mainloop" x="1268" y="237">MAINLOOP · row j + prefetch j+1</text><text class="phase" data-phase-id="epilogue" x="2018" y="237">EPILOGUE · dX + partial dW/dB</text>
  <g display="none">
  <text class="lane" x="92" y="280">Row prefetch</text><text class="lane-note" x="92" y="308">TMA or cp.async ring</text><rect class="node" x="465" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="287">prefetch X + dO</text><rect class="node" x="900" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1065" y="287">stage in sX,sdO</text><path class="arrow" d="M795 286 H897"/><rect class="node" x="1335" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1500" y="287">consume current stage</text><path class="arrow" d="M1230 286 H1332"/><rect class="node" x="1770" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1935" y="287">prefetch future row</text><path class="arrow" d="M1665 286 H1767"/><text class="lane" x="92" y="460">Correction terms</text><text class="lane-note" x="92" y="488">Warp/block/cluster exchange</text><rect class="node" x="465" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="630" y="467">w·dO and x̂</text><rect class="node" x="900" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1065" y="467">RMS: mean(x̂wdy)</text><path class="arrow" d="M795 466 H897"/><rect class="node" x="1335" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1500" y="467">LN: two means</text><path class="arrow" d="M1230 466 H1332"/><rect class="node" x="1770" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1935" y="467">publish reduced terms</text><path class="arrow" d="M1665 466 H1767"/><text class="lane" x="92" y="640">Input gradients</text><text class="lane-note" x="92" y="668">Apply normalization Jacobian</text><rect class="node" x="465" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="630" y="647">form corrected dx</text><rect class="node" x="900" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1065" y="647">optional dResidualOut</text><path class="arrow" d="M795 646 H897"/><rect class="node" x="1335" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1500" y="647">convert/store dx</text><path class="arrow" d="M1230 646 H1332"/><rect class="node" x="1770" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1935" y="647">optional dResidual</text><path class="arrow" d="M1665 646 H1767"/><text class="lane" x="92" y="820">Parameter gradients</text><text class="lane-note" x="92" y="848">Accumulate partials in FP32</text><rect class="node" x="465" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="630" y="827">dW += dO·x̂</text><rect class="node" x="900" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1065" y="827">dB += dO</text><path class="arrow" d="M795 826 H897"/><rect class="node" x="1335" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1500" y="827">one partial per CTA</text><path class="arrow" d="M1230 826 H1332"/><rect class="node" x="1770" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1935" y="827">final reduce kernel</text><path class="arrow" d="M1665 826 H1767"/><path class="dep" d="M630 327 V422"/><path class="dep" d="M1065 507 V602"/><path class="dep" d="M1500 687 V782"/>
  </g>
  <text class="lane" x="92" y="300">Load / prefetch participants</text><text class="lane-note" x="92" y="328">TMA or cp.async two-stage row ring</text><rect class="node operation" x="465" y="270" width="330" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="308">seed X₀,dO₀ → stage 0</text><rect class="node operation" x="875" y="270" width="250" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="1000" y="308">wait stage j</text><rect class="node operation" x="1445" y="270" width="220" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="1555" y="308">prefetch j+1</text><path class="arrow" d="M795 308 H872"/><path class="arrow" d="M1125 308 H1442"/>
  <text class="lane" x="92" y="480">Reduction participants</text><text class="lane-note" x="92" y="508">RMS one mean · LN paired means per stage</text><rect class="node operation" x="875" y="450" width="250" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1000" y="488">w·dO and x̂</text><rect class="node operation" x="1160" y="450" width="250" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1285" y="488">cluster row_reduce</text><path class="arrow" d="M1125 488 H1157"/><rect class="node operation" x="1445" y="450" width="220" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1555" y="488">publish correction</text><path class="arrow" d="M1410 488 H1442"/>
  <text class="lane" x="92" y="660">Gradient lanes</text><text class="lane-note" x="92" y="688">consume correction; release row stage</text><rect class="node operation" x="1160" y="630" width="250" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1285" y="668">form corrected dX</text><rect class="node operation" x="1445" y="630" width="220" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1555" y="668">release stage j</text><path class="arrow" d="M1410 668 H1442"/>
  <text class="lane" x="92" y="840">Output / partial owners</text><text class="lane-note" x="92" y="868">dense dX plus one FP32 partial per CTA</text><rect class="node operation" x="1770" y="810" width="210" height="76" rx="12" fill="#f2d394"/><text class="box" x="1875" y="848">store dX</text><rect class="node operation" x="2015" y="810" width="220" height="76" rx="12" fill="#f2d394"/><text class="box" x="2125" y="848">publish dW / dB partial</text><path class="arrow" d="M1980 848 H2012"/><path class="dep sync" d="M1000 346 V447"/><path class="dep sync" d="M1555 526 V627"/><path class="dep sync" d="M1555 706 V807"/>
