  <text class="memory-label" x="90" y="1172">SMEM</text>
  <rect class="mem-node" x="235.0" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="572.1666666666667" y="1177">input tile(s)</text><text class="mem-note" x="572.1666666666667" y="1206">coalesced staging</text><rect class="mem-node" x="925.3333333333334" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="1262.5" y="1177">exchange / reduce</text><text class="mem-note" x="1262.5" y="1206">barriers + partials</text><rect class="mem-node" x="1615.6666666666667" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="1952.8333333333335" y="1177">output tile</text><text class="mem-note" x="1952.8333333333335" y="1206">when required</text>
  <text class="memory-label" x="90" y="1310">TMEM</text>
  <rect class="mem-node" x="235.0" y="1278" width="2055.0" height="92" rx="11" fill="#cfe9df"/><text class="mem-name" x="1262.5" y="1315">not applicable</text><text class="mem-note" x="1262.5" y="1344">this kernel does not use TMEM</text>
  <text class="panel-title" x="70" y="1485">MEMORY LIFETIMES · STAGE j / j+1 REUSE</text><rect x="60" y="1505" width="2280" height="270" rx="12" fill="#fff" stroke="#d4e0e7"/><text class="memory-label" x="90" y="1595">SMEM</text><g class="resource-lifetime" data-resource-id="row-stage-j"><rect class="life-box" x="465" y="1555" width="1040" height="64" rx="11" fill="#d7e8f2" stroke="#294251"/><text class="mem-name" x="985" y="1582">stage j · Xj / dOj + reduction slots</text><text class="mem-note" x="985" y="1607">consumer wait → correction → release</text></g><g class="resource-lifetime" data-resource-id="row-stage-next"><rect class="life-box" x="1520" y="1555" width="715" height="64" rx="11" fill="#e8f0f5" stroke="#294251"/><text class="mem-name" x="1878" y="1582">same ring slot reused for j+1</text><text class="mem-note" x="1878" y="1607">only after stage-j release</text></g><text class="memory-label" x="90" y="1685">REG</text><g class="resource-lifetime" data-resource-id="grad-regs"><rect class="life-box" x="900" y="1645" width="1335" height="64" rx="11" fill="#cfe9df" stroke="#294251"/><text class="mem-name" x="1568" y="1672">x̂, w·dO, correction, dX and FP32 dW/dB partials</text><text class="mem-note" x="1568" y="1697">mainloop → epilogue; TMEM not used</text></g><text class="note" x="90" y="1748">Alias: stage j and j+1 are sequential occupants of the same two-stage ring, never overlapping in one slot.</text>
