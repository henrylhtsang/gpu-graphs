  <text class="title" x="70" y="66">QuACK RMSNorm / LayerNorm backward · pipelined rows and reductions</text>
  <text class="subtitle" x="70" y="108">Persistent CTAs overlap X/dO movement with correction reductions and partial parameter gradients.</text>
  <text class="subtitle" x="70" y="145">CuTe DSL entry point: <tspan class="source">quack/rmsnorm.py · RMSNormBackward.kernel()</tspan></text>
  <text class="panel-title" x="70" y="195">WARP / WARP-GROUP ROLE TIMELINE</text>
  <text class="role-summary" x="455" y="195">cooperative CTA: participating warps follow the same phase sequence; no dedicated producer / consumer warp roles</text>
