<svg data-authoring="llm-direct" data-authoring-profile="direct-role-memory" data-structure-version="three-phase-role-memory-v1" data-topic-id="quack-kernels" data-graph-id="hadamard-forward-backward" data-kernel-id="hadamard-forward-backward" data-source-id="quack" xmlns="http://www.w3.org/2000/svg" width="2400" height="1840" viewBox="0 0 2400 1840" role="img" aria-labelledby="title desc">
  <title id="title">QuACK Hadamard transform · hierarchical butterfly exchange</title>
  <desc id="desc">QuACK Hadamard transform · hierarchical butterfly exchange. Forward and backward reuse the same self-inverse transform, with caller-selected scaling. H(H(x)) = N·x; autograd invokes the same kernel again with the matching normalization scale.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172734; }
      .title { font-size: 42px; font-weight: 760; } .subtitle { font-size: 21px; fill: #425869; }
      .panel-title { font-size: 18px; font-weight: 780; fill: #526a79; letter-spacing: 1.2px; }
      .lane { font-size: 20px; font-weight: 730; } .lane-note { font-size: 16px; fill: #526a79; }
      .phase { font-size: 15px; font-weight: 700; fill: #607887; text-anchor: middle; letter-spacing: .7px; }
      .box { font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .mini { font-size: 15px; font-weight: 650; fill: #425869; text-anchor: middle; dominant-baseline: middle; }
      .node { stroke: #294251; stroke-width: 1.6; } .grid { stroke: #dce6ec; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #526d7c; stroke-width: 2.2; marker-end: url(#arrow); }
      .dep { fill: none; stroke: #b87912; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#gold); }
      .note { font-size: 18px; font-weight: 650; fill: #704b09; } .source { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #526a79; }
      .role-summary { font-size: 18px; font-weight: 680; fill: #1e5d50; }
      .memory-label { font-size: 19px; font-weight: 760; } .mem-node { stroke: #294251; stroke-width: 1.5; }
      .mem-name { font-size: 18px; font-weight: 740; text-anchor: middle; } .mem-note { font-size: 15px; fill: #526a79; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526d7c"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b87912"/></marker>
  </defs>
  <rect width="2400" height="1840" fill="#f8fafb"/>
  <text class="title" x="70" y="66">QuACK Hadamard transform · hierarchical butterfly exchange</text>
  <text class="subtitle" x="70" y="108">Forward and backward reuse the same self-inverse transform, with caller-selected scaling.</text>
  <text class="subtitle" x="70" y="145">CuTe DSL entry point: <tspan class="source source-specific" data-source-locator="quack/transform/hadamard.py · HadamardTransform.kernel()">quack/transform/hadamard.py · HadamardTransform.kernel()</tspan></text>
  <text class="panel-title" x="70" y="195">WARP / WARP-GROUP ROLE TIMELINE</text>
  <text class="role-summary" x="455" y="195">cooperative CTA: participating warps follow the same phase sequence; no dedicated producer / consumer warp roles</text>
  <rect x="60" y="215" width="2280" height="730" rx="12" fill="#fff" stroke="#d4e0e7" stroke-width="1.5"/>
  <rect class="phase-band" data-phase-id="prologue" x="425" y="216" width="410" height="728" fill="#eef6fa"/><rect class="phase-band" data-phase-id="mainloop" x="835" y="216" width="865" height="728" fill="#fbfcfd"/><rect class="phase-band" data-phase-id="epilogue" x="1700" y="216" width="639" height="728" fill="#fff8e7"/><line x1="835" y1="215" x2="835" y2="945" stroke="#b8c9d3" stroke-width="2"/><line x1="1700" y1="215" x2="1700" y2="945" stroke="#b8c9d3" stroke-width="2"/>
  <line class="grid" x1="425" y1="215" x2="425" y2="945"/>
  <line class="grid" x1="60" y1="395" x2="2340" y2="395"/><line class="grid" x1="60" y1="575" x2="2340" y2="575"/><line class="grid" x1="60" y1="755" x2="2340" y2="755"/>
  <text class="phase" data-phase-id="prologue" x="630" y="237">PROLOGUE · seed row 0</text><text class="phase" data-phase-id="mainloop" x="1268" y="237">MAINLOOP · row j / prefetch j+1</text><text class="phase" data-phase-id="epilogue" x="2018" y="237">EPILOGUE · scale / store</text>
  <g display="none">
  <text class="lane" x="92" y="280">Persistent load loop</text><text class="lane-note" x="92" y="308">One or more rows per CTA</text><rect class="node" x="465" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="287">load row tile</text><rect class="node" x="900" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1065" y="287">optional cp.async</text><path class="arrow" d="M795 286 H897"/><rect class="node" x="1335" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1500" y="287">wait current row</text><path class="arrow" d="M1230 286 H1332"/><rect class="node" x="1770" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1935" y="287">prefetch next row</text><path class="arrow" d="M1665 286 H1767"/><text class="lane" x="92" y="460">Thread-local butterflies</text><text class="lane-note" x="92" y="488">Register-resident radix stages</text><rect class="node" x="465" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="630" y="467">reshape by radix</text><rect class="node" x="900" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1065" y="467">a+b / a−b</text><path class="arrow" d="M795 466 H897"/><rect class="node" x="1335" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1500" y="467">repeat local bits</text><path class="arrow" d="M1230 466 H1332"/><rect class="node" x="1770" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1935" y="467">hold FP32 values</text><path class="arrow" d="M1665 466 H1767"/><text class="lane" x="92" y="640">Cross-thread exchange</text><text class="lane-note" x="92" y="668">Shuffle for small plans, smem otherwise</text><rect class="node" x="465" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="630" y="647">warp shuffle path</text><rect class="node" x="900" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1065" y="647">or store s_exchange</text><path class="arrow" d="M795 646 H897"/><rect class="node" x="1335" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1500" y="647">warp/CTA barrier</text><path class="arrow" d="M1230 646 H1332"/><rect class="node" x="1770" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1935" y="647">load permuted bits</text><path class="arrow" d="M1665 646 H1767"/><text class="lane" x="92" y="820">Scale + store</text><text class="lane-note" x="92" y="848">Tail may store directly</text><rect class="node" x="465" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="630" y="827">final butterfly stage</text><rect class="node" x="900" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1065" y="827">× scale</text><path class="arrow" d="M795 826 H897"/><rect class="node" x="1335" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1500" y="817">direct tail layout</text><text class="mini" x="1500" y="842">or rmem output</text><path class="arrow" d="M1230 826 H1332"/><rect class="node" x="1770" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1935" y="827">predicated vector store</text><path class="arrow" d="M1665 826 H1767"/><path class="dep" d="M630 327 V422"/><path class="dep" d="M1065 507 V602"/><path class="dep" d="M1500 687 V782"/>
  </g>
  <text class="lane" x="92" y="300">Persistent load participants</text><text class="lane-note" x="92" y="328">optional cp.async row pipeline</text><rect class="node operation" x="465" y="270" width="330" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="308">seed row 0</text><rect class="node operation" x="875" y="270" width="250" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="1000" y="308">wait row j</text><rect class="node operation" x="1445" y="270" width="220" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="1555" y="308">prefetch j+1</text><path class="arrow" d="M795 308 H872"/><path class="arrow" d="M1125 308 H1442"/>
  <text class="lane" x="92" y="480">Thread-local butterfly lanes</text><text class="lane-note" x="92" y="508">register-resident radix stages</text><rect class="node operation" x="875" y="450" width="250" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1000" y="488">reshape radix</text><rect class="node operation" x="1160" y="450" width="250" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1285" y="488">a+b / a−b</text><path class="arrow" d="M1125 488 H1157"/>
  <text class="lane" x="92" y="660">Cross-thread exchange</text><text class="lane-note" x="92" y="688">shuffle for warp plans; SMEM otherwise</text><rect class="node operation" x="1160" y="630" width="250" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1285" y="668">shuffle or s_exchange</text><rect class="node operation" x="1445" y="630" width="220" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1555" y="668">warp / CTA barrier</text><path class="arrow" d="M1410 668 H1442"/>
  <text class="lane" x="92" y="840">Output lanes</text><text class="lane-note" x="92" y="868">same kernel for forward and backward</text><rect class="node operation" x="1770" y="810" width="210" height="76" rx="12" fill="#f2d394"/><text class="box" x="1875" y="848">final butterfly × scale</text><rect class="node operation" x="2015" y="810" width="220" height="76" rx="12" fill="#f2d394"/><text class="box" x="2125" y="848">predicated store</text><path class="arrow" d="M1980 848 H2012"/><path class="dep sync" d="M1000 346 V447"/><path class="dep sync" d="M1285 526 V627"/><path class="dep sync" d="M1555 706 V807"/>
  <rect x="70" y="975" width="2260" height="70" rx="11" fill="#fff7df" stroke="#b87912" stroke-width="1.5"/>
  <text class="note" x="100" y="1018">H(H(x)) = N·x; autograd invokes the same kernel again with the matching normalization scale.</text>
  <text class="panel-title" x="70" y="1095">ON-CHIP MEMORY PARTITION</text>
  <rect x="60" y="1120" width="2280" height="310" rx="12" fill="#fff" stroke="#d4e0e7" stroke-width="1.5"/>
  <text class="memory-label" x="90" y="1172">SMEM</text>
  <rect class="mem-node" x="235.0" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="572.1666666666667" y="1177">input tile(s)</text><text class="mem-note" x="572.1666666666667" y="1206">coalesced staging</text><rect class="mem-node" x="925.3333333333334" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="1262.5" y="1177">exchange / reduce</text><text class="mem-note" x="1262.5" y="1206">barriers + partials</text><rect class="mem-node" x="1615.6666666666667" y="1140" width="674.3333333333334" height="92" rx="11" fill="#d7e8f2"/><text class="mem-name" x="1952.8333333333335" y="1177">output tile</text><text class="mem-note" x="1952.8333333333335" y="1206">when required</text>
  <text class="memory-label" x="90" y="1310">TMEM</text>
  <rect class="mem-node" x="235.0" y="1278" width="2055.0" height="92" rx="11" fill="#cfe9df"/><text class="mem-name" x="1262.5" y="1315">not applicable</text><text class="mem-note" x="1262.5" y="1344">this kernel does not use TMEM</text>
  <text class="panel-title" x="70" y="1485">MEMORY LIFETIMES · ROW j / j+1</text><rect x="60" y="1505" width="2280" height="270" rx="12" fill="#fff" stroke="#d4e0e7"/><text class="memory-label" x="90" y="1595">SMEM</text><g class="resource-lifetime" data-resource-id="row-buffer"><rect class="life-box" x="465" y="1555" width="1040" height="64" rx="11" fill="#d7e8f2" stroke="#294251"/><text class="mem-name" x="985" y="1582">row j + optional s_exchange</text><text class="mem-note" x="985" y="1607">read / exchange / barrier / release</text></g><g class="resource-lifetime" data-resource-id="next-row"><rect class="life-box" x="1520" y="1555" width="715" height="64" rx="11" fill="#e8f0f5" stroke="#294251"/><text class="mem-name" x="1878" y="1582">same row buffer reused for j+1</text><text class="mem-note" x="1878" y="1607">after release</text></g><text class="memory-label" x="90" y="1685">REG</text><g class="resource-lifetime" data-resource-id="butterfly-regs"><rect class="life-box" x="875" y="1645" width="1360" height="64" rx="11" fill="#cfe9df" stroke="#294251"/><text class="mem-name" x="1555" y="1672">FP32 butterfly values</text><text class="mem-note" x="1555" y="1697">all radix stages → scale / store; TMEM not used</text></g><text class="note" x="90" y="1748">Alias: row j and j+1 sequentially reuse the persistent row slot; s_exchange is separate scratch within the stage.</text>
</svg>
