  <text class="phase" data-phase-id="prologue" x="630" y="237">PROLOGUE · logits + metadata</text><text class="phase" data-phase-id="mainloop" x="1268" y="237">MAINLOOP · stable row reduction</text><text class="phase" data-phase-id="epilogue" x="2018" y="237">EPILOGUE · loss / LSE / optional dX</text>
  <g display="none">
  <text class="lane" x="92" y="280">Load + metadata</text><text class="lane-note" x="92" y="308">Rows may span an N-cluster</text><rect class="node" x="465" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="287">Load logits → sX</text><rect class="node" x="900" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1065" y="287">read target + weight</text><path class="arrow" d="M795 286 H897"/><rect class="node" x="1335" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1500" y="287">read target logit</text><path class="arrow" d="M1230 286 H1332"/><rect class="node" x="1770" y="245" width="330" height="82" rx="12" fill="#d7e8f2"/><text class="box" x="1935" y="287">ignore-index gate</text><path class="arrow" d="M1665 286 H1767"/><text class="lane" x="92" y="460">Stable reduction</text><text class="lane-note" x="92" y="488">Online or two-pass softmax</text><rect class="node" x="465" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="630" y="467">row max</text><rect class="node" x="900" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1065" y="467">exp(x−max)</text><path class="arrow" d="M795 466 H897"/><rect class="node" x="1335" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1500" y="467">row/cluster sum</text><path class="arrow" d="M1230 466 H1332"/><rect class="node" x="1770" y="425" width="330" height="82" rx="12" fill="#cfe9df"/><text class="box" x="1935" y="467">lse=max+log(sum)</text><path class="arrow" d="M1665 466 H1767"/><text class="lane" x="92" y="640">Loss outputs</text><text class="lane-note" x="92" y="668">One elected lane writes scalars</text><rect class="node" x="465" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="630" y="647">lse−target logit</text><rect class="node" x="900" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1065" y="647">× class weight</text><path class="arrow" d="M795 646 H897"/><rect class="node" x="1335" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1500" y="647">ignored → 0</text><path class="arrow" d="M1230 646 H1332"/><rect class="node" x="1770" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1935" y="647">store loss + LSE</text><path class="arrow" d="M1665 646 H1767"/><text class="lane" x="92" y="820">Optional fused dx</text><text class="lane-note" x="92" y="848">Enabled by return_dx</text><rect class="node" x="465" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="630" y="827">p = exp / sum</text><rect class="node" x="900" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1065" y="827">target lane p−1</text><path class="arrow" d="M795 826 H897"/><rect class="node" x="1335" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1500" y="827">× target weight</text><path class="arrow" d="M1230 826 H1332"/><rect class="node" x="1770" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1935" y="827">predicated dx store</text><path class="arrow" d="M1665 826 H1767"/><path class="dep" d="M630 327 V422"/><path class="dep" d="M1065 507 V602"/><path class="dep" d="M1500 687 V782"/>
  </g>
  <text class="lane" x="92" y="300">All CTA warps</text><text class="lane-note" x="92" y="328">load row logits and scalar metadata</text><rect class="node operation" x="465" y="270" width="330" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="630" y="308">cp.async logits → sX</text><rect class="node operation" x="875" y="270" width="250" height="76" rx="12" fill="#d7e8f2"/><text class="box" x="1000" y="308">target + weight</text><path class="arrow" d="M795 308 H872"/>
  <text class="lane" x="92" y="480">Reduction participants</text><text class="lane-note" x="92" y="508">warp/block/cluster scope selected by N</text><rect class="node operation" x="875" y="450" width="250" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1000" y="488">row max</text><rect class="node operation" x="1160" y="450" width="250" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1285" y="488">exp(x−max)</text><path class="arrow" d="M1125 488 H1157"/><rect class="node operation" x="1445" y="450" width="220" height="76" rx="12" fill="#cfe9df"/><text class="box" x="1555" y="488">row / cluster sum</text><path class="arrow" d="M1410 488 H1442"/>
  <text class="lane" x="92" y="660">Elected scalar owner</text><text class="lane-note" x="92" y="688">one lane publishes row scalars</text><rect class="node operation" x="1160" y="630" width="250" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1285" y="668">LSE = max+log(sum)</text><rect class="node operation" x="1445" y="630" width="220" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1555" y="668">loss = LSE−target</text><path class="arrow" d="M1410 668 H1442"/><rect class="node operation" x="1770" y="630" width="330" height="76" rx="12" fill="#8bcdb8"/><text class="box" x="1935" y="668">store loss + LSE</text><path class="arrow" d="M1665 668 H1767"/>
  <text class="lane" x="92" y="840">Optional fused-dX lanes</text><text class="lane-note" x="92" y="868">enabled by return_dx</text><rect class="node operation" x="1160" y="810" width="250" height="76" rx="12" fill="#f2d394"/><text class="box" x="1285" y="848">p = exp / sum</text><rect class="node operation" x="1445" y="810" width="220" height="76" rx="12" fill="#f2d394"/><text class="box" x="1555" y="848">target p−1</text><path class="arrow" d="M1410 848 H1442"/><rect class="node operation" x="1770" y="810" width="330" height="76" rx="12" fill="#f2d394"/><text class="box" x="1935" y="848">predicated dX store</text><path class="arrow" d="M1665 848 H1767"/><path class="dep sync" d="M1000 346 V447"/><path class="dep sync" d="M1555 526 V627"/><path class="dep sync" d="M1555 706 V807"/>
