  <rect width="2400" height="1500" fill="#f8fafb"/>
  <text class="title" x="70" y="66">QuACK cross entropy forward · loss, LSE, optional dx</text>
  <text class="subtitle" x="70" y="108">One reduction over logits feeds loss, log-sum-exp, and an optional fused gradient.</text>
  <text class="subtitle" x="70" y="145">CuTe DSL entry point: <tspan class="source">quack/cross_entropy.py · CrossEntropy.kernel()</tspan></text>
  <text class="panel-title" x="70" y="195">WARP / WARP-GROUP ROLE TIMELINE</text>
  <text class="role-summary" x="455" y="195">cooperative CTA: participating warps follow the same phase sequence; no dedicated producer / consumer warp roles</text>
