  <text class="panel-title" x="70" y="1485">MEMORY LIFETIMES · SAME SEMANTIC EVENT AXIS</text><rect x="60" y="1505" width="2280" height="270" rx="12" fill="#fff" stroke="#d4e0e7" stroke-width="1.5"/><text class="phase" x="630" y="1532">PROLOGUE</text><text class="phase" x="1268" y="1532">MAINLOOP</text><text class="phase" x="2018" y="1532">EPILOGUE</text><line x1="835" y1="1506" x2="835" y2="1774" stroke="#d4e0e7"/><line x1="1700" y1="1506" x2="1700" y2="1774" stroke="#d4e0e7"/><text class="memory-label" x="90" y="1595">SMEM</text><g class="memory-lifetime resource-lifetime" data-resource-id="smem-working-set"><rect class="life-box" x="465" y="1555" width="1200" height="64" rx="11" fill="#d7e8f2" stroke="#294251"/><text class="mem-name" x="1065" y="1582">logit tile + reduction exchange</text><text class="mem-note" x="1065" y="1607">load → row/cluster reduction → release</text></g><g class="memory-lifetime resource-lifetime" data-resource-id="smem-output"><rect class="life-box" x="1770" y="1555" width="465" height="64" rx="11" fill="#f2d394" stroke="#294251"/><text class="mem-name" x="2002" y="1582">scalar / dX publish</text><text class="mem-note" x="2002" y="1607">epilogue</text></g><text class="memory-label" x="90" y="1685">REG</text><g class="memory-lifetime resource-lifetime" data-resource-id="compute-state"><rect class="life-box" x="900" y="1645" width="1335" height="64" rx="11" fill="#cfe9df" stroke="#294251"/><text class="mem-name" x="1568" y="1672">max, denominator, exp fragments</text><text class="mem-note" x="1568" y="1697">retained through optional fused dX; TMEM not used</text></g><text class="note" x="90" y="1748">No storage alias is inferred: the register state and SMEM reduction buffers are distinct physical resources.</text>
