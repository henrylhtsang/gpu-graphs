  <text class="phase" data-phase-id="prologue" x="630" y="237">PROLOGUE · tile + A₀/B₀</text><text class="phase" data-phase-id="mainloop" x="1268" y="237">MAINLOOP · WGMMA j / prefetch j+1</text><text class="phase" data-phase-id="epilogue" x="2018" y="237">EPILOGUE · D store / tail</text>
