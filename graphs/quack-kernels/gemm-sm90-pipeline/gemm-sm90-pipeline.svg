  <text class="panel-title" x="70" y="1485">MEMORY LIFETIMES · STAGE j / j+1</text><rect x="60" y="1505" width="2280" height="270" rx="12" fill="#fff" stroke="#d4e0e7"/><text class="memory-label" x="90" y="1595">SMEM</text><g class="resource-lifetime" data-resource-id="ab-stage-j"><rect class="life-box" x="465" y="1555" width="1040" height="64" rx="11" fill="#d7e8f2" stroke="#294251"/><text class="mem-name" x="985" y="1582">A/B stage j</text><text class="mem-note" x="985" y="1607">TMA ready → WGMMA issue → release</text></g><g class="resource-lifetime" data-resource-id="ab-stage-next"><rect class="life-box" x="1520" y="1555" width="715" height="64" rx="11" fill="#e8f0f5" stroke="#294251"/><text class="mem-name" x="1878" y="1582">ring slot reused for j+1</text><text class="mem-note" x="1878" y="1607">after consumer release</text></g><text class="memory-label" x="90" y="1685">REG / TMEM</text><g class="resource-lifetime" data-resource-id="acc-regs"><rect class="life-box" x="875" y="1645" width="1360" height="64" rx="11" fill="#cfe9df" stroke="#294251"/><text class="mem-name" x="1555" y="1672">WGMMA accumulators in registers</text><text class="mem-note" x="1555" y="1697">mainloop → epilogue; TMEM is unavailable on SM90</text></g><text class="note" x="90" y="1748">Alias: A/B ring slots recycle across j; D staging is a distinct epilogue allocation.</text>
