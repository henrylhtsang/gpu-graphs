  <text class="lane" x="92" y="840">TMA store / finalizer</text><text class="lane-note" x="92" y="868">split-K finalizer only when selected</text><rect class="node operation" x="1770" y="810" width="210" height="76" rx="12" fill="#f2d394"/><text class="box" x="1875" y="848">TMA store D</text><rect class="node operation" x="2015" y="810" width="220" height="76" rx="12" fill="#f2d394"/><text class="box" x="2125" y="848">drain / next tile</text><path class="arrow" d="M1980 848 H2012"/><path class="dep sync" d="M630 346 V447"/><path class="dep sync" d="M1555 526 V627"/><path class="dep sync" d="M1555 706 V807"/>
