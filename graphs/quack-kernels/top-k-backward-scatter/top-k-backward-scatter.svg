  <text class="title" x="70" y="66">QuACK top-k backward · sparse scatter through shared memory</text>
  <text class="subtitle" x="70" y="108">Selected gradients are transformed, scattered into a zero tile, then written densely.</text>
  <text class="subtitle" x="70" y="145">CuTe DSL entry point: <tspan class="source">quack/topk.py · TopKBackward.kernel()</tspan></text>
  <text class="panel-title" x="70" y="195">WARP / WARP-GROUP ROLE TIMELINE</text>
  <text class="role-summary" x="455" y="195">cooperative CTA: participating warps follow the same phase sequence; no dedicated producer / consumer warp roles</text>
