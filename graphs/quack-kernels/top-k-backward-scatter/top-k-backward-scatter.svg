"/><text class="box" x="1065" y="647">sdX[row,index]=grad</text><path class="arrow" d="M795 646 H897"/><rect class="node" x="1335" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1500" y="647">barrier after scatter</text><path class="arrow" d="M1230 646 H1332"/><rect class="node" x="1770" y="605" width="330" height="82" rx="12" fill="#8bcdb8"/><text class="box" x="1935" y="647">unselected stay zero</text><path class="arrow" d="M1665 646 H1767"/><text class="lane" x="92" y="820">Dense output</text><text class="lane-note" x="92" y="848">Coalesced full-row write</text><rect class="node" x="465" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="630" y="827">sdX → rmem</text><rect class="node" x="900" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1065" y="827">apply N predicate</text><path class="arrow" d="M795 826 H897"/><rect class="node" x="1335" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1500" y="827">vector store dx</text><path class="arrow" d="M1230 826 H1332"/><rect class="node" x="1770" y="785" width="330" height="82" rx="12" fill="#f2d394"/><text class="box" x="1935" y="827">next row tile</text><path class="arrow" d="M1665 826 H1767"/><path class="dep" d="M630 327 V422"/><path class="dep" d="M1065 507 V602"/><path class="dep" d="M1500 687 V782"/>
