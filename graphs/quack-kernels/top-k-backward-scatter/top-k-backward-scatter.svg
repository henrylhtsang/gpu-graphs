  <text class="phase" data-phase-id="prologue" x="630" y="237">PROLOGUE · load / initialize</text><text class="phase" data-phase-id="mainloop" x="1268" y="237">MAINLOOP · selected-space math + scatter</text><text class="phase" data-phase-id="epilogue" x="2018" y="237">EPILOGUE · dense store / release</text>
